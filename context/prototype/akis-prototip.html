<title>Akış İçerik Paneli</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell — sticky sidebar + scrolling work area; summary first, detail in sheets/dialogs over the list */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --surface-2:#f1f3f6; --surface-3:#e8ebf0;
  --border:#e3e6ec; --border-strong:#cdd2db;
  --fg:#111318; --muted:#5b6170; --subtle:#8b919d;
  --accent:#4b45d6; --accent-hover:#3d37c0; --accent-fg:#ffffff; --accent-soft:#ecebfd;
  --draft:#5f6673; --draft-bg:#eef0f3;
  --review:#9f5606; --review-bg:#fdf0db;
  --pub:#157043; --pub-bg:#e2f4e9;
  --danger:#c4302a; --danger-bg:#fdeceb;
  --shadow-sm:0 1px 2px rgba(16,18,24,.06);
  --shadow:0 1px 2px rgba(16,18,24,.04),0 10px 30px rgba(16,18,24,.07);
  --shadow-lg:0 30px 80px rgba(16,18,24,.22);
  --scrim:rgba(17,19,24,.34);
  --font:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0c10; --surface:#121419; --surface-2:#181b21; --surface-3:#20242c;
  --border:#23272f; --border-strong:#353a46;
  --fg:#eceef3; --muted:#9ba1ad; --subtle:#6c7280;
  --accent:#8e8bff; --accent-hover:#a6a3ff; --accent-fg:#0b0c10; --accent-soft:rgba(142,139,255,.14);
  --draft:#a7adb9; --draft-bg:#1f2229;
  --review:#f2b45a; --review-bg:rgba(242,180,90,.12);
  --pub:#5ad493; --pub-bg:rgba(90,212,147,.12);
  --danger:#ff7d74; --danger-bg:rgba(255,125,116,.12);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  --shadow-lg:0 30px 80px rgba(0,0,0,.6);
  --scrim:rgba(0,0,0,.55);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0b0c10; --surface:#121419; --surface-2:#181b21; --surface-3:#20242c;
  --border:#23272f; --border-strong:#353a46;
  --fg:#eceef3; --muted:#9ba1ad; --subtle:#6c7280;
  --accent:#8e8bff; --accent-hover:#a6a3ff; --accent-fg:#0b0c10; --accent-soft:rgba(142,139,255,.14);
  --draft:#a7adb9; --draft-bg:#1f2229;
  --review:#f2b45a; --review-bg:rgba(242,180,90,.12);
  --pub:#5ad493; --pub-bg:rgba(90,212,147,.12);
  --danger:#ff7d74; --danger-bg:rgba(255,125,116,.12);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  --shadow-lg:0 30px 80px rgba(0,0,0,.6);
  --scrim:rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.min{min-width:0}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.num{font-variant-numeric:tabular-nums}
.sub{color:var(--muted);font-size:12.5px}
.muted{color:var(--subtle)}

/* shell */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:20px;
  padding:18px 14px 16px max(14px,env(safe-area-inset-left,0px));border-right:1px solid var(--border);background:var(--surface);z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:15px;letter-spacing:-.02em}
.brand-name{font-weight:600;font-size:15px;letter-spacing:-.01em;line-height:1.2}
.brand-sub{font-size:12px;color:var(--subtle);line-height:1.3}
.nav{display:grid;gap:2px}
.nav-item{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:8px;color:var(--muted);font-weight:500;transition:background .15s,color .15s}
.nav-item:hover{background:var(--surface-2);color:var(--fg)}
.nav-item[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.nav-item[aria-current="page"] svg{color:var(--accent)}
.nav-badge{margin-left:auto;font:500 11px/1 var(--mono);padding:4px 6px;border-radius:6px;background:var(--review-bg);color:var(--review)}
.side-foot{margin-top:auto;display:grid;gap:12px}
.proto{justify-self:start;font-size:11px;line-height:1.3;color:var(--subtle);border:1px dashed var(--border-strong);border-radius:6px;padding:3px 8px}
.prefs{display:flex;gap:8px;align-items:center}
.prefs .select{flex:1}
.me{display:flex;align-items:center;gap:10px;padding:10px 6px 2px;border-top:1px solid var(--border)}
.me-name{font-weight:500;font-size:13px;line-height:1.3}
.topbar{display:none}
.nav-scrim{display:none}
.main{min-width:0}
.page{max-width:1240px;margin:0 auto;padding-block:30px 72px;
  padding-left:max(clamp(16px,4vw,40px),env(safe-area-inset-left,0px));
  padding-right:max(clamp(16px,4vw,40px),env(safe-area-inset-right,0px))}

/* primitives */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:9px;
  border:1px solid var(--border);background:var(--surface);color:var(--fg);font-weight:500;cursor:pointer;white-space:nowrap;
  box-shadow:var(--shadow-sm);transition:background .15s,border-color .15s,transform .1s}
.btn:hover{border-color:var(--border-strong);background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);border-color:transparent;color:var(--accent-fg)}
.btn-primary:hover{background:var(--accent-hover);border-color:transparent}
.btn-ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--muted)}
.btn-ghost:hover{background:var(--surface-2);color:var(--fg);border-color:transparent}
.btn-sm{height:30px;padding:0 10px;font-size:13px;border-radius:8px}
.icon-btn{width:36px;height:36px;display:inline-grid;place-items:center;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;flex:none}
.icon-btn:hover{color:var(--fg);background:var(--surface-2)}
.input,.select select,textarea.input{width:100%;height:36px;border:1px solid var(--border);border-radius:9px;background:var(--surface);padding:0 11px;
  transition:border-color .15s,box-shadow .15s;outline:none}
textarea.input{height:auto;min-height:110px;padding:9px 11px;resize:vertical;line-height:1.5}
.input::placeholder,textarea.input::placeholder{color:var(--subtle)}
.input:focus,.select select:focus,textarea.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.input[aria-invalid="true"],.select select[aria-invalid="true"]{border-color:var(--danger);box-shadow:0 0 0 3px var(--danger-bg)}
.select{position:relative;display:inline-block;min-width:0}
.select select{appearance:none;-webkit-appearance:none;padding-right:32px;cursor:pointer}
.select::after{content:"";position:absolute;right:13px;top:50%;width:6px;height:6px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.select.sm select{height:36px;font-size:13px}
.search{position:relative;display:flex;align-items:center;flex:1 1 240px;max-width:340px;min-width:0}
.search svg{position:absolute;left:11px;color:var(--subtle);pointer-events:none}
.search .input{padding-left:34px}
.seg{display:inline-flex;gap:2px;padding:3px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 10px;border:0;border-radius:7px;background:transparent;color:var(--muted);font-weight:500;font-size:13px;cursor:pointer;white-space:nowrap}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow-sm)}
.seg .n{font:500 11px/1 var(--mono);color:var(--subtle)}
.mdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--st);flex:none}
.st-DRAFT{--st:var(--draft);--st-bg:var(--draft-bg)}
.st-REVIEW{--st:var(--review);--st-bg:var(--review-bg)}
.st-PUBLISHED{--st:var(--pub);--st-bg:var(--pub-bg)}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px 0 9px;border-radius:999px;font-size:12.5px;font-weight:500;
  color:var(--st);background:var(--st-bg);border:1px solid transparent;white-space:nowrap}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
button.pill{cursor:pointer;padding-right:6px;transition:border-color .15s}
button.pill:hover,button.pill[aria-expanded="true"]{border-color:color-mix(in srgb,var(--st) 40%,transparent)}
button.pill svg{opacity:.7}
.plat{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--border);
  font:500 10.5px/1 var(--mono);color:var(--muted);letter-spacing:-.02em}
.sw{display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--c);flex:none}
.av{flex:none;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:9.5px;font-weight:600;letter-spacing:.02em;vertical-align:middle}
.av.md{width:32px;height:32px;font-size:11.5px}
.av.xs{width:18px;height:18px;font-size:8.5px}
.cav{flex:none;width:40px;height:40px;border-radius:10px;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:600;font-size:14px;letter-spacing:.01em}
.cav.lg{width:52px;height:52px;border-radius:13px;font-size:17px}
.badge{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:6px;font-size:11px;font-weight:500;background:var(--surface-3);color:var(--muted);vertical-align:middle}

/* page head */
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
.eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--subtle);font-weight:500;margin-bottom:6px}
.page-head h1,.dhead h1{font-size:26px;line-height:1.2;font-weight:600;letter-spacing:-.025em}
.lede{color:var(--muted);margin-top:4px;max-width:62ch}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.toolbar .select{flex:0 1 190px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px;min-height:28px}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 6px 0 10px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-size:12.5px;font-weight:500;border:0;cursor:pointer}
.chip svg{opacity:.8}
.count{font-size:12.5px;color:var(--subtle);margin-left:auto}
.linkbtn{border:0;background:none;color:var(--muted);font-size:12.5px;font-weight:500;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--border-strong);padding:4px}
.linkbtn:hover{color:var(--fg)}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.kpi{display:grid;gap:6px;text-align:left;padding:18px 20px;border-radius:14px;border:1px solid var(--border);background:var(--surface);cursor:pointer;transition:border-color .15s,transform .15s,box-shadow .15s}
.kpi:hover{border-color:var(--border-strong);box-shadow:var(--shadow);transform:translateY(-1px)}
.kpi-l{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);font-weight:500}
.kpi-v{font-size:32px;line-height:1.15;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.attn{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px 10px 14px;border-radius:12px;background:var(--danger-bg);color:var(--danger);margin-bottom:16px;font-weight:500;font-size:13.5px}
.attn span{flex:1 1 240px}
.attn .btn{color:var(--danger);border-color:transparent;background:var(--surface)}
.dash{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);grid-template-areas:"week review" "week act";gap:18px;align-items:start}
.p-week{grid-area:week}.p-review{grid-area:review}.p-act{grid-area:act}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border)}
.panel-h h2{font-size:14px;font-weight:600;letter-spacing:-.01em}
.panel-b{padding:16px 18px}
.stack{display:flex;gap:2px;height:10px;border-radius:999px;overflow:hidden;background:var(--surface-2)}
.stack.sm{height:6px}
.stack i{display:block;background:var(--st);min-width:3px}
.dist{display:grid;gap:10px;margin:0 0 22px}
.dist .stack{height:8px}
.dist-l{display:flex;flex-wrap:wrap;gap:4px 22px}
.dist-i{display:inline-flex;align-items:center;gap:7px;border:0;background:none;padding:2px 0;color:var(--muted);font-size:13px;cursor:pointer}
.dist-i:hover{color:var(--fg)}
.dist-i b{font:500 13px/1 var(--mono);color:var(--fg)}
.dist-i span{font:400 12px/1 var(--mono);color:var(--subtle)}
.wl{display:grid;padding:6px 0 10px}
.wl-g{display:grid;grid-template-columns:minmax(0,9.5em) minmax(0,1fr);gap:14px;padding:12px 20px;border-top:1px solid var(--border)}
.wl-g:first-child{border-top:0}
.wl-d{display:grid;gap:1px;align-content:start;padding-top:7px}
.wl-dn{font-weight:500;font-size:13px;text-transform:capitalize}
.wl-dd{font:400 12px/1.3 var(--mono);color:var(--subtle)}
.wl-d.today .wl-dn{color:var(--accent)}
.wl ul{list-style:none;margin:0;padding:0;display:grid;gap:2px;min-width:0}
.wl-i{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,auto);align-items:center;gap:10px;width:100%;padding:7px 10px;margin:0 -10px;border:0;border-radius:8px;background:none;text-align:left;cursor:pointer;width:calc(100% + 20px)}
.wl-i:hover{background:var(--surface-2)}
.wl-t{font-weight:500;font-size:13.5px}
.wl-c{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);max-width:14em;min-width:0}
.rv{list-style:none;margin:0;padding:8px}
.rv li{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:10px}
.rv li:hover{background:var(--surface-2)}
.rv-main{flex:1;display:flex;align-items:center;gap:11px;min-width:0;border:0;background:none;text-align:left;cursor:pointer;padding:2px}
.rv-t{font-weight:500;font-size:13.5px}
.rv-m{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);min-width:0}
.act{list-style:none;margin:0;padding:8px 20px 14px;display:grid}
.act li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:12px;padding:11px 0;border-bottom:1px solid var(--border)}
.act li:last-child{border-bottom:0}
.act-x{font-size:13px;line-height:1.45;color:var(--muted)}
.act-x b{color:var(--fg);font-weight:500}
.act-x em{font-style:normal;font-weight:500;color:var(--st)}
.act-x button{all:unset;cursor:pointer}
.act-x button:hover b{text-decoration:underline;text-underline-offset:2px}
.act-t{font-size:11.5px;color:var(--subtle);margin-top:2px}
.empty-s{padding:26px 18px;text-align:center;color:var(--subtle);font-size:13px}

/* rows */
.rows{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,2.8fr) minmax(0,1.3fr) minmax(0,1fr) 160px;gap:20px;align-items:center;
  padding:14px 20px;border-top:1px solid var(--border);cursor:pointer;transition:background .12s}
.rows .row:first-child{border-top:0}
.row:hover{background:var(--surface-2)}
.row:focus-visible{outline-offset:-2px}
.row-head{cursor:default;padding-block:9px;background:var(--surface-2);font-size:12px;font-weight:500;color:var(--subtle);letter-spacing:.02em}
.row-head:hover{background:var(--surface-2)}
.rows.no-client .row{grid-template-columns:minmax(0,3fr) minmax(0,1fr) 160px}
.c-title{order:1;display:flex;align-items:center;gap:11px;min-width:0}
.c-client{order:2;display:flex;align-items:center;gap:8px;min-width:0;color:var(--fg)}
.c-date{order:4;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.c-status{order:5}
.br{display:none}
.ttl{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.date{font:400 12.5px/1.2 var(--mono);color:var(--fg)}
.date.od{color:var(--danger)}
.od-tag{font-size:11px;font-weight:500;color:var(--danger);background:var(--danger-bg);padding:2px 6px;border-radius:5px}
.empty{display:grid;justify-items:center;gap:10px;padding:56px 20px;text-align:center}
.empty-ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);color:var(--subtle)}
.empty p{color:var(--muted)}

/* clients */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:16px}
.ccard{display:grid;gap:18px;padding:20px;border-radius:14px;border:1px solid var(--border);background:var(--surface);transition:border-color .15s,box-shadow .15s,transform .15s}
.ccard:hover{border-color:var(--border-strong);box-shadow:var(--shadow);transform:translateY(-1px)}
.ccard.off{opacity:.72}
.cc-top{display:flex;gap:12px;align-items:center;min-width:0}
.cc-name{font-weight:600;font-size:15px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;min-width:0}
.cc-counts{display:flex;align-items:center;gap:12px;margin-top:9px;font:500 12px/1 var(--mono);color:var(--muted)}
.cc-counts span{display:inline-flex;align-items:center;gap:5px}
.cc-counts .tot{margin-left:auto;font-family:var(--font);font-weight:400;color:var(--subtle)}
.cc-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:12px;border-top:1px solid var(--border);font-size:12.5px;min-width:0}
.cc-foot .who{display:flex;align-items:center;gap:7px;color:var(--fg);min-width:0}
.crumb{margin-bottom:14px}
.crumb a{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:13px;font-weight:500}
.crumb a:hover{color:var(--fg)}
.dhead{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;padding:20px;border:1px solid var(--border);border-radius:14px;background:var(--surface);margin-bottom:18px}
.dh-main{display:flex;gap:14px;align-items:center;min-width:0}
.info{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding-top:18px;border-top:1px solid var(--border)}
.info dt{font-size:12px;color:var(--subtle);margin-bottom:3px;display:flex;align-items:center;gap:6px}
.info dd{margin:0;font-weight:500;overflow-wrap:anywhere}

/* overlays */
.scrim{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(2px);opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s;z-index:40}
.scrim.open{opacity:1;visibility:visible}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(540px,100%);display:flex;flex-direction:column;background:var(--surface);border-left:1px solid var(--border);
  box-shadow:var(--shadow-lg);transform:translateX(102%);visibility:hidden;transition:transform .26s cubic-bezier(.2,.8,.2,1),visibility .26s;z-index:50;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.sheet.open{transform:none;visibility:visible}

function viewDashboard(){
  const C=state.contents,me=userById(ME);
  const active=state.clients.filter(c=>c.active).length;
  const review=sortContents(C.filter(c=>c.status==='REVIEW'));
  const week=C.filter(c=>c.date&&c.date>=today&&c.date<addDays(7)&&c.status!=='PUBLISHED');
  const overdue=C.filter(isOverdue);
  const kpis=[['clients',t('kpi_clients'),active],['total',t('kpi_total'),C.length],['review',t('kpi_review'),review.length,'<i class="mdot st-REVIEW"></i>'],['week',t('kpi_week'),week.length]];
  const cnt=countBy(C),total=C.length||1;
  const groups=[...Array(7)].map((_,i)=>{const d=addDays(i);return{d,i,items:C.filter(c=>c.date&&+c.date===+d).sort((x,y)=>STATUSES.indexOf(x.status)-STATUSES.indexOf(y.status))}}).filter(g=>g.items.length);
  const acts=state.activity.slice().sort((x,y)=>y.at-x.at).slice(0,5);
  const dayLabel=g=>g.i<2?relDay(g.d):fmtD(g.d,{weekday:'long'});
  return `
  <header class="page-head"><div><p class="eyebrow">${esc(fmtD(today,{weekday:'long',day:'numeric',month:'long'}))}</p><h1>${esc(t('hello',{name:me.name.split(' ')[0]}))}</h1></div>
    <button type="button" class="btn btn-primary" data-action="new-content">${ic('plus',16)}${t('newContent')}</button></header>
  <section class="kpis">${kpis.map(k=>`<button type="button" class="kpi" data-action="kpi" data-kpi="${k[0]}"><span class="kpi-l">${k[3]||''}${k[1]}</span><span class="kpi-v">${fmtN(k[2])}</span></button>`).join('')}</section>
  <section class="dist" aria-label="${t('p_breakdown')}"><div class="stack">${STATUSES.map(s=>cnt[s]?`<i class="st-${s}" style="flex:${cnt[s]}"></i>`:'').join('')}</div>
    <div class="dist-l">${STATUSES.map(s=>`<button type="button" class="dist-i" data-action="kpi" data-kpi="status" data-v="${s}"><i class="mdot st-${s}"></i>${t('st_'+s)}<b>${cnt[s]}</b><span>${Math.round(cnt[s]/total*100)}%</span></button>`).join('')}</div></section>
  ${overdue.length?`<div class="attn" role="status">${ic('alert',18)}<span>${t('attn_overdue',{n:overdue.length})}</span><button type="button" class="btn btn-sm" data-action="kpi" data-kpi="overdue">${t('show')}${ic('arrow',14)}</button></div>`:''}
  <div class="dash">
    <section class="panel p-week"><div class="panel-h"><h2>${t('p_week')}</h2><button type="button" class="linkbtn" data-action="kpi" data-kpi="week">${t('viewAll')}</button></div>
      ${groups.length?`<div class="wl">${groups.map(g=>`<div class="wl-g"><div class="wl-d ${g.i===0?'today':''}"><span class="wl-dn">${esc(dayLabel(g))}</span><span class="wl-dd num">${esc(fmtD(g.d))}</span></div>
        <ul>${g.items.map(c=>{const cl=clientById(c.clientId);return `<li><button type="button" class="wl-i" data-action="open-content" data-id="${c.id}"><i class="mdot st-${c.status}" title="${t('st_'+c.status)}"></i><span class="sr">${t('st_'+c.status)}</span><span class="wl-t trunc">${esc(c.title)}</span><span class="wl-c">${sw(cl)}<span class="trunc">${esc(cl.name)}</span></span></button></li>`}).join('')}</ul></div>`).join('')}</div>`:`<p class="empty-s">${t('empty_day')}</p>`}
    </section>
    <section class="panel p-review"><div class="panel-h"><h2>${t('p_review')} <span class="sub num">· ${review.length}</span></h2><button type="button" class="linkbtn" data-action="kpi" data-kpi="review">${t('viewAll')}</button></div>
      ${review.length?`<ul class="rv">${review.slice(0,5).map(c=>{const cl=clientById(c.clientId);return `<li>
        <button type="button" class="rv-main" data-action="open-content" data-id="${c.id}"><span class="min" style="display:grid;gap:3px"><span class="rv-t trunc">${esc(c.title)}</span><span class="rv-m">${sw(cl)}<span class="trunc">${esc(cl.name)}</span><span>·</span>${dateCell(c)}</span></span></button>
        <button type="button" class="btn btn-sm" data-action="quick-status" data-id="${c.id}" data-to="PUBLISHED">${t('next_REVIEW')}</button></li>`}).join('')}</ul>`:`<p class="empty-s">${t('empty_review')}</p>`}
    </section>
    <section class="panel p-act"><div class="panel-h"><h2>${t('p_activity')}</h2></div>
      <ul class="act">${acts.map(x=>{const u=userById(x.userId);let txt='';
        if(x.kind==='client'){const cl=clientById(x.clientId);txt=`<a href="#client-${cl.id}">${t('act_client',{user:esc(u.name),name:esc(cl.name)})}</a>`}
        else{const c=contentById(x.contentId);if(!c)return '';txt=`<button type="button" data-action="open-content" data-id="${c.id}">${t(x.kind==='created'?'act_created':'act_status',{user:esc(u.name),title:esc(c.title),to:t('st_'+x.to),s:x.to})}</button>`}
        return `<li>${avatar(u)}<div class="min"><div class="act-x">${txt}</div><div class="act-t">${esc(ago(x.at))}</div></div></li>`}).join('')}</ul>
    </section>

function fillContents(){

/* ---------- router ---------- */
function render(){
  const h=(location.hash||'').slice(1)||'dashboard';
  let route=h,param=null;
  if(h.startsWith('client-')){route='client';param=h.slice(7)}
  if(!['dashboard','clients','contents','client'].includes(route))route='dashboard';
  state.route=route;state.param=param;
  const m=$('#main');
  if(route==='dashboard')m.innerHTML=viewDashboard();
  else if(route==='clients'){m.innerHTML=viewClients();fillClients()}
  else if(route==='contents'){m.innerHTML=viewContents();fillContents()}
  else{m.innerHTML=viewClient(param);fillClient()}
  renderShell();
}
function refresh(){
  if(state.route==='contents'){fillContents();renderShell()}
  else if(state.route==='client'){fillClient();renderShell()}
  else if(state.route==='clients'){fillClients();renderShell()}
  else{const y=scrollY;render();scrollTo(0,y)}
  if(sheetCtx&&sheetCtx.id)renderSheetStatus();
}
function go(route){if(location.hash==='#'+route)render();else location.hash=route}
window.addEventListener('hashchange',()=>{closeMenu();render();scrollTo(0,0)});

/* ---------- status ---------- */
function changeStatus(id,to){
  const c=contentById(id);if(!c||c.status===to)return;
  const from=c.status,prevPub=c.publishedAt;
  c.status=to;if(to==='PUBLISHED')c.publishedAt=new Date();
  const act={id:uid('a'),at:new Date(),userId:ME,kind:'status',contentId:id,to};
  state.activity.push(act);
  refresh();
  toast(`${esc(c.title)} → <b>${t('st_'+to)}</b>`,()=>{c.status=from;c.publishedAt=prevPub;state.activity=state.activity.filter(x=>x!==act);refresh()});
}

/* ---------- menu ---------- */
const menuEl=$('#menu');let menuFor=null;
function openMenu(anchor,id){
  if(menuFor===id&&!menuEl.hidden){closeMenu();return}
  closeMenu();
  const c=contentById(id);
  menuEl.innerHTML=`<div class="menu-lbl">${t('changeStatus')}</div>`+STATUSES.map(s=>`<button type="button" role="menuitemradio" aria-checked="${c.status===s}" class="menu-item" data-action="set-status" data-id="${id}" data-to="${s}"><i class="mdot st-${s}"></i>${t('st_'+s)}${c.status===s?ic('check',15):''}</button>`).join('');
  menuEl.hidden=false;
  const r=anchor.getBoundingClientRect(),mw=menuEl.offsetWidth,mh=menuEl.offsetHeight;
  let left=Math.max(8,Math.min(r.left,innerWidth-mw-8)),top=r.bottom+6;
  if(top+mh>innerHeight-8)top=Math.max(8,r.top-mh-6);
  menuEl.style.left=left+'px';menuEl.style.top=top+'px';
  anchor.setAttribute('aria-expanded','true');menuFor=id;menuEl._anchor=anchor;
  (menuEl.querySelector('[aria-checked="true"]')||menuEl.querySelector('.menu-item')).focus();
}
function closeMenu(){if(menuEl.hidden)return;menuEl.hidden=true;if(menuEl._anchor)menuEl._anchor.setAttribute('aria-expanded','false');menuFor=null}
window.addEventListener('scroll',closeMenu,{passive:true,capture:true});
window.addEventListener('resize',closeMenu);

/* ---------- toast ---------- */
function toast(html,undo){
  const el=document.createElement('div');el.className='toast';
  el.innerHTML=`<span>${html}</span>${undo?`<button type="button">${t('undo')}</button>`:''}`;
  if(undo)el.querySelector('button').onclick=()=>{undo();el.remove()};
  $('#toasts').appendChild(el);setTimeout(()=>el.remove(),5200);
  while($('#toasts').children.length>3)$('#toasts').firstChild.remove();
}

  if(!el)return;

  switch(a){

    case 'open-nav':setNav(true);break;

    case 'theme':{const n=isDark()?'light':'dark';document.documentElement.dataset.theme=n;store.set('akis-theme',n);renderShell();break}
    case 'open-content':openSheet(id);break;
    case 'new-content':openSheet(null,el.dataset.client);break;
    case 'status-menu':e.stopPropagation();openMenu(el,id);break;
    case 'set-status':closeMenu();changeStatus(id,el.dataset.to);if(menuEl._anchor&&document.contains(menuEl._anchor))menuEl._anchor.focus({preventScroll:true});break;
    case 'quick-status':changeStatus(id,el.dataset.to);break;
    case 'sheet-next':{const c=contentById(sheetCtx.id);changeStatus(c.id,c.status==='DRAFT'?'REVIEW':'PUBLISHED');break}
    case 'kpi':{const k=el.dataset.kpi;if(k==='clients'){state.cfilter='active';state.cq='';go('clients');break}
      Object.assign(f,{q:'',status:'',type:'',client:'',week:false,overdue:false});
      if(k==='review')f.status='REVIEW';if(k==='week')f.week=true;if(k==='overdue')f.overdue=true;if(k==='status')f.status=el.dataset.v;
      go('contents');break}
    case 'f-status':f.status=el.dataset.v;fillContents();break;
    case 'chip-x':f[el.dataset.k]=false;fillContents();break;
    case 'f-clear':Object.assign(f,{q:'',status:'',type:'',client:'',week:false,overdue:false});render();break;
    case 'cfilter':state.cfilter=el.dataset.v;fillClients();break;
    case 'ctab':state.ctab=el.dataset.v;fillClient();break;
    case 'new-client':openClientDialog();break;
    case 'close-sheet':closeSheet();break;
    case 'close-dialog':closeDialog();break;
    case 'scrim':if(dialog.classList.contains('open'))closeDialog();else closeSheet();break;
    case 'save-content':saveContent(el.dataset.mode);break;
    case 'save-client':saveClient();break;
    case 'swatch':dlgColor=el.dataset.v;$('#swatches').innerHTML=swatchesHTML();$(`#swatches [data-v="${dlgColor}"]`).focus();break;
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(!menuEl.hidden){const an=menuEl._anchor;closeMenu();if(an)an.focus();return}if(dialog.classList.contains('open'))return closeDialog();if(sheet.classList.contains('open'))return closeSheet();setNav(false);return}
  const r=e.target.closest&&e.target.closest('[role="button"][data-action]');
  if(r&&e.target===r&&(e.key==='Enter'||e.key===' ')){e.preventDefault();r.click()}
  if(!menuEl.hidden&&(e.key==='ArrowDown'||e.key==='ArrowUp')){const items=[...menuEl.querySelectorAll('.menu-item')];const i=items.indexOf(document.activeElement);items[(i+(e.key==='ArrowDown'?1:-1)+items.length)%items.length].focus();e.preventDefault()}
  if(e.key==='Enter'&&e.target.closest&&e.target.closest('#clientForm')&&e.target.tagName==='INPUT'){e.preventDefault();saveClient()}
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){state.filters.q=e.target.value;fillContents()}
  else if(e.target.id==='cq'){state.cq=e.target.value;fillClients()}
  else if(e.target.id==='sTitle'&&e.target.value.trim())setErr('sTitle','');
  else if(e.target.id==='dName'&&e.target.value.trim())setErr('dName','');
  else if(e.target.id==='dEmail')setErr('dEmail','');
});
document.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='fType'){state.filters.type=e.target.value;fillContents()}
  else if(id==='fClient'){state.filters.client=e.target.value;fillContents()}
  else if(id==='sType'){$('#sPlatform').innerHTML=platformOptions(e.target.value)}
  else if(id==='sClient'&&e.target.value)setErr('sClient','');
  else if(id==='lang'){state.lang=e.target.value;store.set('akis-lang',state.lang);if(sheet.classList.contains('open'))closeSheet();if(dialog.classList.contains('open'))closeDialog();render()}
});
document.addEventListener('submit',e=>e.preventDefault());
mq.addEventListener&&mq.addEventListener('change',renderShell);

render();
})();
</script>
